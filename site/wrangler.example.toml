# Copie ce fichier en wrangler.toml et remplace les valeurs entre <...>.
name = "retrodeck-site"
main = "src/index.js"
compatibility_date = "2026-08-20"
account_id = "<ton account id Cloudflare>"

workers_dev = true
routes = [
  { pattern = "<ton.sous-domaine.exemple.com>", custom_domain = true }
]

# Pages statiques ; le Worker ne reçoit que /api/*
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "404-page"

# D1 : liste d'attente (créer avec : wrangler d1 create retrodeck-waitlist, puis wrangler d1 execute ... --file schema.sql)
[[d1_databases]]
binding = "DB"
database_name = "retrodeck-waitlist"
database_id = "<id de la base D1>"

# KV : anti-spam (hash d'IP éphémère, TTL 60 s, jamais conservé)
[[kv_namespaces]]
binding = "RL"
id = "<id du namespace KV>"

# Facultatif : paiement. Le code de paiement est dans un Worker privé qui n'est pas dans ce dépôt.
# [[services]]
# binding = "PAY"
# service = "<nom du Worker de paiement>"

# R2 : zip du pack de fiches (privé ; servi par /api/pack/download)
[[r2_buckets]]
binding = "PACK"
bucket_name = "retrodeck-pack"

# Pack de fiches : emails 2 et 3, chaque jour à 08:00 UTC (sans effet tant que l'envoi n'est pas activé)
[triggers]
crons = ["0 8 * * *"]

# Envoi d'emails (Brevo) : la fonction « pack contre email » est ACTIVE seulement si ces deux valeurs existent.
#   npx wrangler secret put BREVO_API_KEY        (saisie masquée ; clé API Brevo)
#   puis décommenter / renseigner (expéditeur validé dans Brevo) :
[vars]
SITE_ORIGIN = "https://retrodeck.lastparadox.dev"
MAIL_FROM_NAME = "LastParadox"
# MAIL_FROM_EMAIL = "support@lastparadox.xyz"
